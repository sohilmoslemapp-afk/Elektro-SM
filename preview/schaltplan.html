<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ElektroPlan SM — Schaltplan</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#edf3fa;color:#13263f;font:16px system-ui,-apple-system,sans-serif}main{max-width:1200px;margin:20px auto;padding:18px;background:white;border-radius:18px;box-shadow:0 5px 30px #19355a20}h1{margin:0 0 12px}.eps-toolbar{display:flex;gap:8px;flex-wrap:wrap}.eps-toolbar button,.eps-toolbar select{padding:11px;border:1px solid #9aacc4;border-radius:9px;background:#fff;color:#16365c;cursor:pointer}.eps-toolbar button:focus-visible{outline:3px solid #2188e8}@media(hover:none){.eps-toolbar button,.eps-toolbar select{min-height:44px;min-width:44px}}.eps-canvas{display:block;width:100%;height:auto;min-height:280px;border:2px solid #b8c9df;border-radius:12px;background:white;touch-action:none;margin:14px 0;overflow:visible}.eps-canvas [data-id]:focus-visible rect{stroke:#e07b00;stroke-width:4}.eps-state{white-space:pre-wrap;overflow-wrap:anywhere;max-height:200px;overflow:auto}#editor>p{margin:10px 0}#editor[dir=rtl] .eps-toolbar{direction:rtl}@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation:none!important;transition:none!important}}@media(max-width:600px){main{margin:0;padding:10px;border-radius:0}.eps-toolbar{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.eps-toolbar button,.eps-toolbar select{width:100%;font-size:14px;padding:12px 6px}.eps-canvas{min-height:300px}h1{font-size:1.25rem}}@media print{.eps-toolbar,#editor>p,.eps-state,main>p{display:none}main{box-shadow:none;margin:0}.eps-canvas{border:0}}
</style></head><body><main><h1>⚡ ElektroPlan SM — Schaltplan</h1><div id="editor"></div><p><a href="index.html">← Kamera / Camera / الكاميرا</a></p></main>
<script src="src/terminal-graph.js"></script><script src="src/schematic-graph-adapter.js"></script><script src="src/schematic-editor.js"></script>
<script>const editor=ElektroPlanEditor.create(document.getElementById('editor'),{adapter:ElektroPlanGraphAdapter,validator:ElektroPlanTerminals});
try {
 const raw=sessionStorage.getItem('elektroplan-schematic-import');
 if(raw){
  sessionStorage.removeItem('elektroplan-schematic-import');
  const incoming=JSON.parse(raw);
  const project=editor.getProject();
  if(incoming && /^[A-Za-z0-9_-]{1,32}$/.test(incoming.id) && Array.isArray(incoming.manualTerminals) && incoming.manualTerminals.length<=24 && incoming.manualTerminals.every(t=>typeof t==='string' && /^[A-Za-z0-9_+.-]{1,24}$/.test(t)) && new Set(incoming.manualTerminals).size===incoming.manualTerminals.length && !project.symbols.some(s=>s.id===incoming.id)){
   project.symbols.push({id:incoming.id,x:100,y:100,manualTerminals:incoming.manualTerminals,manufacturer:String(incoming.manufacturer||'').slice(0,120),model:String(incoming.model||'').slice(0,120),type:String(incoming.type||'').slice(0,120),origin:'manual',terminalStatus:incoming.manualTerminals.length?'unverified_manual':'pending_documentation'});
   editor.setProject(project);

  }
 }
} catch(error){console.warn('Schematic transfer was not applied:',error.message)}</script></body></html>
