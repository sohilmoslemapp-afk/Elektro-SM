<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ElektroPlan SM – Grundriss V3</title><style>body{font:16px system-ui;margin:14px;background:#f3f5f9}main{max-width:1150px;margin:auto}button,input,select{padding:9px;margin:4px}svg{width:100%;background:white;border:1px solid #aaa;touch-action:none}#info{font-weight:600}button{cursor:pointer}</style><main><label>🌐 <select id="lang"><option value="de">Deutsch</option><option value="en">English</option><option value="ar">العربية</option></select></label><h2 id="heading">Grundriss – Wände, Türen, Fenster</h2><p id="disclaimer">Prototyp. Keine Bauplanung oder zertifizierte Vermessung. 1 Zeichnungseinheit = 1 cm.</p><label id="toolLabel">Werkzeug <select id="tool"><option value="wall">Wand</option><option value="door">Tür</option><option value="window">Fenster</option><option value="select">Auswählen</option></select></label><label id="countlabel">Anzahl / Count / العدد <input id="count" type="number" min="1" max="24" value="4" style="width:60px"></label><label>Element <select id="element"><option value="spot">Spotlight / سبوت</option><option value="pushbutton">Taster / طقّة</option><option value="sensor">Sensor / حساس</option><option value="smoke">Smoke detector / كاشف دخان</option><option value="data">Data / داتا</option><option value="camera">Camera / كاميرا</option><option value="led">LED strip / شريط LED</option></select></label><button id="generic">＋ Vorschlag / Suggest / اقترح</button><button id="lights">💡 Deckenleuchten vorschlagen</button><button id="sockets">🔌 Steckdosen vorschlagen</button><button id="accept" disabled>✓ Übernehmen</button><button id="reject" disabled>✕ Verwerfen</button><button id="undo">↶ Undo</button><button id="save">JSON</button><input type="file" id="load" accept=".json,application/json"><button id="view3d">3D-Vorschau</button><label id="commandLabel">Befehl <input id="command" placeholder="wall 100 100 400 100"></label><button id="run">▶</button><button id="voice">🎤</button><p id="info"></p><svg id="plan" viewBox="0 0 900 600" aria-label="Floor plan"><g id="walls"></g><g id="openings"></g><g id="overlay"></g><g id="fixtures"></g></svg><div id="preview3d" hidden><h3>3D — schematische Wandansicht (keine echte Raumvermessung)</h3><svg id="scene" viewBox="0 0 900 600"></svg></div></main><script>
const $=id=>document.getElementById(id),T={de:['Grundriss – Wände, Türen, Fenster','Prototyp. Keine Bauplanung oder zertifizierte Vermessung. 1 Zeichnungseinheit = 1 cm.','Werkzeug','Wand','Tür','Fenster','Auswählen','Befehl','3D-Vorschau','Wand auswählen und dann Tür/Fenster platzieren.'],en:['Floor plan – walls, doors, windows','Prototype. Not approved construction design or certified surveying. 1 drawing unit = 1 cm.','Tool','Wall','Door','Window','Select','Command','3D preview','Select a wall before placing a door/window.'],ar:['مخطط الطابق – جدران وأبواب وشبابيك','نموذج تجريبي، ليس مخطط بناء معتمداً أو قياساً هندسياً مصدقاً. كل وحدة رسم = 1 سم.','الأداة','جدار','باب','شباك','تحديد','الأمر','معاينة ثلاثية الأبعاد','حدد جداراً أولاً لإضافة باب أو شباك.']};let walls=[],openings=[],fixtures=[],undo=[],seq=1,selected=null,first=null,roomStart=null,roomRect=null,pending=[];const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function tr(){const lang=$('lang').value,t=T[lang];document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';$('heading').textContent=t[0];$('disclaimer').textContent=t[1];$('toolLabel').firstChild.textContent=t[2]+' ';$('commandLabel').firstChild.textContent=t[7]+' ';$('view3d').textContent=t[8];['wall','door','window','select'].forEach((v,i)=>$('tool').querySelector('[value='+v+']').textContent=t[i+3]);$('lights').textContent={de:'💡 Deckenleuchten vorschlagen',en:'💡 Suggest ceiling lights',ar:'💡 اقترح لمبات السقف'}[lang];$('sockets').textContent={de:'🔌 Steckdosen vorschlagen',en:'🔌 Suggest sockets',ar:'🔌 اقترح برايز'}[lang];$('accept').textContent={de:'✓ Übernehmen',en:'✓ Accept',ar:'✓ اعتماد'}[lang];$('reject').textContent={de:'✕ Verwerfen',en:'✕ Reject',ar:'✕ إلغاء'}[lang];localStorage.setItem('elektroplan-language',lang)}$('lang').value=T[localStorage.getItem('elektroplan-language')]?localStorage.getItem('elektroplan-language'):'de';$('lang').onchange=tr;tr();const info=s=>$('info').textContent=s;function snapshot(){undo.push(JSON.stringify({walls,openings,fixtures,seq}));if(undo.length>40)undo.shift()}$('undo').onclick=()=>{if(!undo.length)return;({walls,openings,fixtures,seq}=JSON.parse(undo.pop()));selected=null;pending=[];render()};function point(e){const r=$('plan').getBoundingClientRect();return{x:Math.round((e.clientX-r.left)*900/r.width),y:Math.round((e.clientY-r.top)*600/r.height)}}function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}function nearest(p){let best=null,d=Infinity;for(const w of walls){const dx=w.x2-w.x1,dy=w.y2-w.y1,l=dx*dx+dy*dy;if(!l)continue;const t=Math.max(0,Math.min(1,((p.x-w.x1)*dx+(p.y-w.y1)*dy)/l)),q={x:w.x1+t*dx,y:w.y1+t*dy},dd=dist(p,q);if(dd<d){best={w,t,q};d=dd}}return d<20?best:null}function addWall(a,b){if(dist(a,b)<10)return; snapshot();walls.push({id:'w'+seq++,x1:a.x,y1:a.y,x2:b.x,y2:b.y});render()}function addOpening(kind,p){const n=nearest(p);if(!n)return info(T[$('lang').value][9]);snapshot();openings.push({id:'o'+seq++,wall:n.w.id,t:n.t,kind});render()}function render(){const w=$('walls'),o=$('openings');w.innerHTML=walls.map(a=>'<line x1="'+a.x1+'" y1="'+a.y1+'" x2="'+a.x2+'" y2="'+a.y2+'" stroke="'+(selected===a.id?'#f80':'#222')+'" stroke-width="9" stroke-linecap="round"/>').join('');o.innerHTML=openings.map(a=>{const p=walls.find(w=>w.id===a.wall);if(!p)return '';const x=p.x1+(p.x2-p.x1)*a.t,y=p.y1+(p.y2-p.y1)*a.t;return '<circle cx="'+x+'" cy="'+y+'" r="11" fill="'+(a.kind==='door'?'#23a36a':'#3688df')+'" stroke="white" stroke-width="3"/>'}).join('');$('fixtures').innerHTML=fixtures.concat(pending).map(f=>'<g opacity="'+(pending.includes(f)?.5:1)+'"><circle cx="'+f.x+'" cy="'+f.y+'" r="9" fill="'+(f.kind==='light'?'#f3c742':'#6e8fff')+'" stroke="#243044" stroke-width="2"/><text x="'+(f.x+11)+'" y="'+(f.y-9)+'" font-size="12">'+(f.kind==='light'?'L':'S')+'</text></g>').join('');$('overlay').innerHTML=roomRect?'<rect x="'+roomRect.x+'" y="'+roomRect.y+'" width="'+roomRect.w+'" height="'+roomRect.h+'" fill="none" stroke="#00a" stroke-dasharray="7 5" stroke-width="2"/>':'';$('accept').disabled=$('reject').disabled=!pending.length;info(walls.length+' walls · '+openings.length+' openings · '+fixtures.length+' fixtures · '+(selected||''))}$('plan').addEventListener('pointerdown',e=>{const p=point(e),tool=$('tool').value;if(tool==='wall'){if(!first){first=p;info('Second point / Zweiter Punkt / النقطة الثانية')}else{addWall(first,p);first=null}}else if(tool==='door'||tool==='window')addOpening(tool,p);else{if(!roomStart){roomStart=p;info('Choose opposite room corner / Gegenüberliegende Ecke / اختر الزاوية المقابلة')}else{roomRect={x:Math.min(roomStart.x,p.x),y:Math.min(roomStart.y,p.y),w:Math.abs(roomStart.x-p.x),h:Math.abs(roomStart.y-p.y)};roomStart=null;const n=nearest(p);selected=n?n.w.id:null;render()}}});function count(){const n=Number($('count').value);if(!Number.isInteger(n)||n<1||n>24){info('Count 1–24 / Anzahl 1–24 / العدد من 1 إلى 24');return null}return n}function proposeLights(){const n=count();if(!n)return;if(!roomRect||roomRect.w<30||roomRect.h<30)return info('Select rectangular room with two taps using Select tool / اختر الغرفة بنقطتين');const cols=Math.ceil(Math.sqrt(n*roomRect.w/roomRect.h)),rows=Math.ceil(n/cols);pending=[];for(let i=0;i<n;i++){const col=i%cols,row=Math.floor(i/cols);pending.push({kind:'light',x:Math.round(roomRect.x+(col+1)*roomRect.w/(cols+1)),y:Math.round(roomRect.y+(row+1)*roomRect.h/(rows+1))})}render();info('PREVIEW ONLY: '+n+' ceiling light positions. Not a verified lighting design.')}function proposeSockets(){const n=count();if(!n)return;if(!selected)return info('Select a wall first / Wand auswählen / حدد جداراً أولاً');const w=walls.find(w=>w.id===selected);if(!w)return info('Wall missing');pending=[];for(let i=0;i<n;i++){const t=(i+1)/(n+1);pending.push({kind:'socket',wall:w.id,t,x:Math.round(w.x1+t*(w.x2-w.x1)),y:Math.round(w.y1+t*(w.y2-w.y1))})}render();info('PREVIEW ONLY: '+n+' sockets on selected wall. Verify installation zones and standards.')}$('lights').onclick=proposeLights;$('sockets').onclick=proposeSockets;$('accept').onclick=()=>{if(!pending.length)return;snapshot();fixtures.push(...pending.map(f=>({...f,id:'f'+seq++})));pending=[];render()};$('reject').onclick=()=>{pending=[];render()};const catalog={spot:{glyph:'✦',placement:'room'},pushbutton:{glyph:'T',placement:'wall'},sensor:{glyph:'S',placement:'room'},smoke:{glyph:'D',placement:'room'},data:{glyph:'N',placement:'wall'},camera:{glyph:'C',placement:'wall'},led:{glyph:'━',placement:'room'}};function proposeGeneric(type){const n=count(),item=catalog[type];if(!n||!item)return info('Unsupported element / Unbekanntes Element / عنصر غير مدعوم');pending=[];if(item.placement==='room'){if(!roomRect||roomRect.w<30||roomRect.h<30)return info('Select a rectangular area with two taps in Select mode / حدد الغرفة بنقطتين');const cols=Math.ceil(Math.sqrt(n*roomRect.w/roomRect.h)),rows=Math.ceil(n/cols);for(let i=0;i<n;i++){const c=i%cols,r=Math.floor(i/cols);pending.push({kind:type,x:Math.round(roomRect.x+(c+1)*roomRect.w/(cols+1)),y:Math.round(roomRect.y+(r+1)*roomRect.h/(rows+1))})}}else{const w=walls.find(w=>w.id===selected);if(!w)return info('Select a wall / Wand auswählen / حدد الحائط');for(let i=0;i<n;i++){const t=(i+1)/(n+1);pending.push({kind:type,wall:w.id,t,x:Math.round(w.x1+t*(w.x2-w.x1)),y:Math.round(w.y1+t*(w.y2-w.y1))})}}render();info('PREVIEW ONLY: '+n+' × '+type+'; verify actual placement and applicable rules before accepting.')} $('generic').onclick=()=>proposeGeneric($('element').value);function interpretGeneric(v,nums){const aliases=[['spot',/سبوت|سبوتات|spotlights?|einbaustrahler|spots?/i],['pushbutton',/طقات|طقات|طقه|طقة|taster|push.?buttons?/i],['sensor',/حساس|حساسات|sensor|melder/i],['smoke',/دخان|rauchmelder|smoke.?detector/i],['data',/داتا|netzwerk|data.?points?|network/i],['camera',/كاميرا|كاميرات|kamera|cameras?/i],['led',/شريط.?إنارة|شريط.?اضاءة|شريط.?إضاءة|led.?strip|led.?band|lichtband/i]];const hit=aliases.find(a=>a[1].test(v));if(!hit)return false;if(nums.length)$('count').value=nums[0];$('element').value=hit[0];proposeGeneric(hit[0]);return true}function command(){const v=$('command').value.trim(),nums=(v.match(/-?\d+(?:\.\d+)?/g)||[]).map(Number);if(/^(wall|wand|جدار)/i.test(v)&&nums.length>=4)return addWall({x:nums[0],y:nums[1]},{x:nums[2],y:nums[3]});if(interpretGeneric(v,nums))return;if(/^(lights|leuchten|lampen|لمبات|مصابيح)/i.test(v)){if(nums.length)$('count').value=nums[0];return proposeLights()}if(/^(sockets|steckdosen|برايز|مقابس)/i.test(v)){if(nums.length)$('count').value=nums[0];return proposeSockets()}if(/^(accept|übernehmen|اعتمد)/i.test(v))return $('accept').click();if(/^(reject|verwerfen|إلغاء|الغاء)/i.test(v))return $('reject').click();if(/^(undo|rückgängig|تراجع)/i.test(v))return $('undo').click();if(/^(3d|preview|vorschau|ثلاثي)/i.test(v))return $('view3d').click();info('Supported: wall x1 y1 x2 y2 / Wand / جدار; undo; 3d.')} $('run').onclick=command;$('command').onkeydown=e=>{if(e.key==='Enter')command()};$('voice').onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return info('Speech unavailable / Sprache nicht verfügbar / الصوت غير متاح');const r=new SR();r.lang={de:'de-DE',en:'en-US',ar:'ar-SA'}[$('lang').value];r.onresult=e=>{$('command').value=e.results[0][0].transcript;command()};r.onerror=e=>info(e.error);r.start()};$('save').onclick=()=>{const blob=new Blob([JSON.stringify({kind:'elektroplan-grundriss-draft',version:1,unit:'cm',walls,openings,fixtures},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='grundriss-draft.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('load').onchange=async e=>{const f=e.target.files?.[0];if(!f||f.size>1000000)return;try{const d=JSON.parse(await f.text());if(d.kind!=='elektroplan-grundriss-draft'||!Array.isArray(d.walls)||!Array.isArray(d.openings)||d.walls.length>500||d.openings.length>1000||!d.walls.every(w=>[w.x1,w.x2,w.y1,w.y2].every(Number.isFinite)))throw Error('invalid');snapshot();walls=d.walls;openings=d.openings;fixtures=Array.isArray(d.fixtures)&&d.fixtures.length<2000?d.fixtures:[];pending=[];seq=1+Math.max(0,...walls.map(w=>Number(String(w.id).slice(1))||0),...openings.map(o=>Number(String(o.id).slice(1))||0),...fixtures.map(f=>Number(String(f.id).slice(1))||0));render()}catch(err){info('Invalid file / Ungültige Datei / ملف غير صالح')}};$('view3d').onclick=()=>{const box=$('preview3d');box.hidden=!box.hidden;if(box.hidden)return;const polys=walls.map(w=>{const a={x:150+w.x1*.65-w.y1*.28,y:90+w.x1*.18+w.y1*.3},b={x:150+w.x2*.65-w.y2*.28,y:90+w.x2*.18+w.y2*.3};return '<polygon points="'+[[a.x,a.y],[b.x,b.y],[b.x,b.y+120],[a.x,a.y+120]].map(p=>p.join(',')).join(' ')+'" fill="#cad5e3" stroke="#52657d" stroke-width="2"/>'});$('scene').innerHTML=polys.join('')};render();
