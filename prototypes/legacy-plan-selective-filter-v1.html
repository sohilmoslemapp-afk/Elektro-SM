<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ElektroPlan SM – Altplan-Filter V1</title><style>body{font:16px system-ui;margin:16px;background:#f4f6fa}main{max-width:1100px;margin:auto}canvas{max-width:100%;background:white;border:1px solid #777;touch-action:none}label,button{display:inline-block;margin:6px;padding:8px}button{cursor:pointer}#status{font-weight:bold}</style><main><h2>Altplan-Bearbeitung – experimenteller Bildfilter</h2><p>Original bleibt unverändert. Nur Rasterbilder; keine Symbolerkennung, kein echtes DXF, keine OCR. Vor dem Export immer Vorschau prüfen.</p><input id="file" type="file" accept="image/png,image/jpeg"><label>Filter <select id="mode"><option value="red">Rote Pixel</option><option value="blue">Blaue Pixel</option><option value="black">Dunkle Pixel (auch Linien!)</option><option value="horizontal">Horizontale Linien (heuristisch)</option><option value="vertical">Vertikale Linien (heuristisch)</option><option value="region">Bereich manuell markieren</option></select></label><label>Schwelle <input id="threshold" type="range" min="15" max="100" value="45"></label><button id="preview">Vorschau</button><button id="apply">Änderung übernehmen</button><button id="undo">Rückgängig</button><button id="reset">Original</button><button id="png">PNG speichern</button><button id="pdf">Drucken / PDF</button><p id="status">Bild auswählen. Für Symbolgruppen (Lampen, Sicherungen, Sirenen) ist noch separate Erkennung nötig.</p><canvas id="canvas" width="900" height="600"></canvas></main><script>
const $=id=>document.getElementById(id),c=$('canvas'),ctx=c.getContext('2d',{willReadFrequently:true});let original=null,current=null,preview=null,history=[],rect=null,start=null;
const status=s=>$('status').textContent=s;function show(data){if(data){c.width=data.width;c.height=data.height;ctx.putImageData(data,0,0)}}
$('file').onchange=async e=>{const f=e.target.files[0];if(!f||!/^image\/(png|jpeg)$/.test(f.type)||f.size>12000000)return status('Nur PNG/JPEG bis 12 MB.');const url=URL.createObjectURL(f);try{const img=new Image();await new Promise((ok,no)=>{img.onload=ok;img.onerror=no;img.src=url});if(img.width*img.height>12000000)throw Error('Bild zu groß');c.width=img.width;c.height=img.height;ctx.drawImage(img,0,0);original=ctx.getImageData(0,0,c.width,c.height);current=ctx.getImageData(0,0,c.width,c.height);preview=null;history=[];rect=null;status('Bild geladen. Filter wählen und Vorschau prüfen.')}catch(err){status(err.message)}finally{URL.revokeObjectURL(url)}};
function build(){if(!current)return null;const src=current.data,w=current.width,h=current.height,out=new ImageData(new Uint8ClampedArray(src),w,h),mode=$('mode').value,t=Number($('threshold').value);const dark=i=>src[i]<135&&src[i+1]<135&&src[i+2]<135;let count=0;for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=(y*w+x)*4,r=src[i],g=src[i+1],b=src[i+2];let hit=false;if(mode==='red')hit=r>g+t&&r>b+t;if(mode==='blue')hit=b>r+t&&b>g+t;if(mode==='black')hit=Math.max(r,g,b)<Math.round(170-t);if(mode==='region'&&rect)hit=x>=rect.x&&x<rect.x+rect.w&&y>=rect.y&&y<rect.y+rect.h;if((mode==='horizontal'||mode==='vertical')&&dark(i)){let n=0;const radius=8;for(let k=-radius;k<=radius;k++){const xx=mode==='horizontal'?x+k:x,yy=mode==='vertical'?y+k:y;if(xx>=0&&xx<w&&yy>=0&&yy<h&&dark((yy*w+xx)*4))n++}hit=n>=14}if(hit){out.data[i]=255;out.data[i+1]=255;out.data[i+2]=255;count++}}status('Vorschau: '+count+' Pixel aufgehellt. Rasterfilter kann auch unerwünschte Inhalte entfernen.');return out}
$('preview').onclick=()=>{preview=build();show(preview)};$('apply').onclick=()=>{if(!current)return;const next=preview||build();if(!next)return;history.push(current);if(history.length>15)history.shift();current=next;preview=null;show(current);status('Änderung übernommen; Rückgängig möglich.')};$('undo').onclick=()=>{if(history.length){current=history.pop();preview=null;show(current);status('Letzte Änderung rückgängig.')}};$('reset').onclick=()=>{if(original){current=original;preview=null;history=[];show(current);status('Original wiederhergestellt.')}};$('png').onclick=()=>{if(!current)return;show(current);const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download='altplan-bearbeitet.png';a.click()};$('pdf').onclick=()=>{if(!current)return;show(current);window.print()};function point(e){const b=c.getBoundingClientRect();return{x:Math.floor((e.clientX-b.left)*c.width/b.width),y:Math.floor((e.clientY-b.top)*c.height/b.height)}}c.addEventListener('pointerdown',e=>{if($('mode').value!=='region')return;start=point(e);c.setPointerCapture(e.pointerId)});c.addEventListener('pointerup',e=>{if(!start)return;const p=point(e);rect={x:Math.min(p.x,start.x),y:Math.min(p.y,start.y),w:Math.abs(p.x-start.x),h:Math.abs(p.y-start.y)};start=null;status('Bereich markiert. Vorschau wählen.')});
</script><style>@media print{body{margin:0;background:white}main>*:not(canvas){display:none!important}canvas{border:0;max-width:100%;max-height:100vh}}</style></html>
