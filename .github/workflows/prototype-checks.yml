name: ElektroPlan SM prototype checks
on:
  push:
    branches: [development/component-recognition-v1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prototype-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static regression checks
        run: node tests/prototype-static-check.cjs
