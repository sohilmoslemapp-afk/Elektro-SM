name: ElektroPlan unit tests
on:
  push:
    branches:
      - ElektroPlan-Entwicklung-1
    paths:
      - 'prototypes/**'
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/elektroplan-tests.yml'
  workflow_dispatch:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: V132 ranking
        run: node tests/V132-ranking.test.js
      - name: V133 manufacturer safety
        run: node tests/V133-safe-matching.test.js
      - name: Manufacturer terminal label safety
        run: node tests/manufacturer-terminal-labels.test.js
      - name: Manufacturer evidence review size bounds
        run: node tests/manufacturer-evidence-bounds.test.js
      - name: Manufacturer evidence and exact article-number safety
        run: node --test tests/manufacturer-evidence.test.js
      - name: OCR identification input safety bounds
        run: node tests/component-recognition-bounds.test.js
      - name: Exact component article number recognition
        run: node tests/component-exact-part-number.test.js
      - name: OCR recognition fallback and error handling
        run: node --test tests/image-text-recognition.test.js
      - name: Bounded experimental image OCR output
        run: node tests/image-text-bounds.test.js
      - name: Integrated OCR and source UI contract
        run: node tests/integrated-ui-contract.test.js
      - name: Trilingual interface safety contract
        run: node tests/language-safety.test.js
      - name: V134 source provenance
        run: node tests/V134-source-records.test.js
      - name: Schematic Unicode identifier safety
        run: node tests/schematic-unicode-ids.test.js
      - name: Schematic structural safety bounds
        run: node tests/schematic-bounds.test.js
      - name: Schematic structural validation
        run: node tests/schematic-validation.test.js

      - name: Terminal graph validation
        run: node tests/terminal-graph.test.js

      - name: Integrated project import size guard
        run: node tests/integrated-import-size-guard.test.js
      - name: Integrated duplicate wire key regression
        run: node tests/integrated-wire-key.test.js
      - name: Integrated Schaltplan UI wiring
        run: node tests/integrated-schematic-ui.test.js

      - name: Unicode project import safety regression
        run: node tests/project-import-unicode-ids.test.js
      - name: Project import envelope shape regression
        run: node tests/project-import-envelope.test.js
      - name: Oversized project import early rejection
        run: node tests/project-import-limits.test.js
      - name: Indexed terminal-mapped import regression
        run: node tests/project-import-terminal-index.test.js
      - name: Manual terminal label import safety
        run: node tests/project-import-terminal-labels.test.js
      - name: Imported evidence HTTPS URL safety
        run: node tests/project-import-evidence-url.test.js
      - name: Imported evidence calendar date safety
        run: node tests/project-import-evidence-date.test.js
      - name: Legacy manufacturer document URL safety
        run: node tests/project-import-legacy-document-url.test.js
      - name: Project import validation
        run: node tests/project-import-validation.test.js
