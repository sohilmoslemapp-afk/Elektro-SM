name: ElektroPlan SM regression checks
on:
  push:
    branches:
      - ElektroPlan-Entwicklung-1
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax checks
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find src tests -type f -name '*.js' -print0)
      - name: Install browser test dependency
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Run regression test files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' tests < <(find tests -type f -name '*.test.js' -print0 | sort -z)
          if (( ${#tests[@]} == 0 )); then
            echo "No regression tests found" >&2
            exit 1
          fi
          for test in "${tests[@]}"; do
            echo "Running $test"
            node "$test"
          done
