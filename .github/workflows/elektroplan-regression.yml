name: ElektroPlan SM regression checks
on:
  push:
    branches:
      - ElektroPlan-Entwicklung-1
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax checks
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find src tests -type f -name '*.js' -print0)
      - name: Core schematic connection safety checks
        shell: bash
        run: |
          set -euo pipefail
          node tests/schematic-graph-adapter.test.js
          node tests/connection-package-safety.test.js
          node tests/schematic-editor-integration.test.js
      - name: Install browser test dependency
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Run regression test files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' tests < <(find tests -type f -name '*.test.js' -print0 | sort -z)
          if (( ${#tests[@]} == 0 )); then
            echo "No regression tests found" >&2
            exit 1
          fi
          failed=0
          for test in "${tests[@]}"; do
            echo "::group::Running $test"
            if node "$test"; then
              echo "PASS $test"
            else
              echo "::error file=$test::Regression test failed"
              echo "FAIL $test" | tee -a regression-failures.txt
              failed=1
            fi
            echo "::endgroup::"
          done
          exit "$failed"
      - name: Upload regression failure summary
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: regression-failures
          path: regression-failures.txt
          if-no-files-found: ignore
