name: ElektroPlan quality gate
on:
  push:
    branches: [ElektroPlan-Entwicklung-1]
  pull_request:
  workflow_dispatch:
jobs:
  structural-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax checks
        run: |
          node --check src/schematic-validation.js
          node --check src/project-import-validation.js
          node --check src/terminal-graph.js
      - name: Terminal-graph regression
        run: node tests/terminal-graph.test.js
      - name: Expanded terminal graph regression
        run: node tests/terminal-graph-regression.test.js
      - name: Project import and schematic regression
        run: node tests/project-schematic-regression.test.js
      - name: Search-ranking regression
        run: node tests/V132-ranking.test.js
      - name: Conservative manufacturer and model matching
        run: node tests/V133-safe-matching.test.js
      - name: Manufacturer evidence and article-number gate
        run: node --test tests/manufacturer-evidence.test.js
      - name: OCR recognition unit tests
        run: node --test tests/image-text-recognition.test.js
      - name: Source provenance validation
        run: node tests/V134-source-records.test.js
      - name: Integrated editor UI contract
        run: node tests/integrated-ui-contract.test.js
      - name: CSV export formula injection regression
        run: node tests/csv-safety.test.js
      - name: Mobile Chromium browser smoke test
        timeout-minutes: 8
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          node tests/browser-smoke.test.js
          node tests/integrated-diagram-browser.test.js
          node tests/integrated-import-transaction-browser.test.js
          node tests/integrated-print-browser.test.js
          node tests/integrated-png-export-browser.test.js
          node tests/integrated-wire-warning-browser.test.js
          node tests/integrated-terminal-strip-browser.test.js
          node tests/integrated-pointer-cancel-browser.test.js
          node tests/tablet-desktop-smoke.test.js
          node tests/trilingual-browser.test.js
          node tests/cross-platform-trilingual-browser.test.js
          node tests/command-input-browser.test.js
          node tests/schematic-pictograms-browser.test.js
          node tests/motor-control-browser.test.js
          node tests/schematic-wire-numbering-browser.test.js
          node tests/schematic-capacity-browser.test.js
      - name: Integrated prototype inline JavaScript syntax
        run: |
          node - <<'NODE'
          const fs=require('node:fs'),vm=require('node:vm');
          const html=fs.readFileSync('prototypes/ElektroPlan-SM-integriert.html','utf8');
          const blocks=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/g)].map(x=>x[1]).filter(x=>x.trim().length>0);
          if(blocks.length!==1)throw Error('Expected one inline application script');
          new vm.Script(blocks[0],{filename:'ElektroPlan-SM-integriert.html'});
          console.log('Integrated inline JS syntax passed');
          NODE
